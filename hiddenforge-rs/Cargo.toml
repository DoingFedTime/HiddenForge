[package]
name = "hiddenforge"
version = "3.0.1"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-only"
description = "HiddenForge in-image runtime: supervisor, healthcheck, guards and operator commands"
publish = false

# One dependency, by design: the raw system-call bindings maintained by the Rust
# project. Everything else (the Tor control protocol, JSON, the guards) is written
# here, so the image carries no third-party code beyond libc itself.
[dependencies]
libc = "=0.2.191"

[profile.release]
panic = "abort"          # a panic stops the process; it never unwinds into half-done state
overflow-checks = true   # integer overflow is a crash, not a silent wrap
lto = true
codegen-units = 1
opt-level = 2
strip = true
debug = false

[profile.dev]
overflow-checks = true
