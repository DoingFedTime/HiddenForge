# Forgejo Actions CI for HiddenForge.
#
# Runs on the project's Forgejo instance (sambent.dev). Not GitHub, not Docker Hub.
# Workflows live in .forgejo/ (the Forgejo-native path; Forgejo also reads
# .github/workflows for compatibility).
#
# Jobs target the self-hosted runner labelled `docker`. Publishing the built
# image and signing its digest are separate, deliberate local steps (signing
# needs a hardware key), so they are not in this file.
#
# TRUST BOUNDARY: the runner is HOST-MODE, so a job executes as the operator on
# the workstation. Every job therefore carries a guard that runs only for a
# push or for a pull request whose head is THIS repository -- a fork PR must
# never get host code execution. The guard is fail-closed: if the context does
# not expose `pull_request.head.repo`, the job is skipped rather than run.
#
# PINNING: every `uses:` is FULLY QUALIFIED (host and repository) and pinned to
# a commit SHA (the tag is in a trailing comment for humans), and every scanner
# container is pinned by digest, exactly as the Dockerfile pins the base image
# and the vendored mkp224o tarball. A tag is a mutable dependency with write
# access to this build.
#
# The host is part of the pin. A short name like `actions/checkout` resolves
# against the instance's DEFAULT_ACTIONS_URL, a value this repository cannot
# read, so the pin would only be as reproducible as an out-of-band setting. All
# eight are therefore written as full URLs: `actions/checkout` and
# `hadolint/hadolint-action` from github.com, `forgejo/upload-artifact` from
# code.forgejo.org (it does not exist on github.com).
name: ci

on:
  push:
    branches: ["**"]
    # Tags too: tagging is the release trigger, and the live E2E must run against
    # the tagged commit. Do not publish the image until this run is green --
    # a tag whose CI never ran (or failed) must not become an image.
    tags: ["v*"]
  pull_request:
  schedule:
    # Daily, so an advisory published after the last commit is caught even when
    # nothing is being pushed. A push-triggered scan cannot see that.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: hadolint Dockerfile
        # Fully-qualified GitHub URL, deliberately. `hadolint/hadolint-action`
        # does NOT exist on code.forgejo.org (verified with git ls-remote), and
        # the runner resolves short action names against the instance's
        # DEFAULT_ACTIONS_URL. Which of those two it is cannot be seen from the
        # repository, so this step must not depend on the answer. i2pforge, on
        # the same runner, calls the host `hadolint` binary for the same reason.
        uses: https://github.com/hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: python syntax (every shipped .py plus the extensionless CLI)
        run: |
          python3 -m py_compile entrypoint.py healthcheck.py vanity.py
          python3 -m py_compile scripts/hiddenforge
      - name: lint + type toolchain
        run: |
          python3 -m venv /tmp/hf-lint
          # pytest and hypothesis are REQUIRED, not optional: typecheck.sh
          # checks tests/ as well as the sources (that is the point of it), and
          # without them mypy reports 12 import-not-found errors and the job
          # fails. Locally this was invisible because the dev venv has them.
          #
          # --require-hashes with requirements-ci.txt: the tooling that JUDGES
          # the image is fetched with the same integrity as the image's own
          # dependencies (the Dockerfile already installs that way). All three
          # CI venvs install from the one file, so they cannot drift apart.
          /tmp/hf-lint/bin/pip install --quiet --require-hashes \
            -r requirements-ci.txt
      - name: ruff
        run: |
          # scripts/hiddenforge has no .py extension, so it must be named
          # explicitly: `ruff check .` silently skips it.
          /tmp/hf-lint/bin/ruff check . scripts/hiddenforge
          /tmp/hf-lint/bin/ruff check scripts/check_manifest.py scripts/coverage_summary.py
      - name: mypy (sources AND tests, including the extensionless CLI)
        run: MYPY=/tmp/hf-lint/bin/mypy sh scripts/typecheck.sh

  unit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: host unit + property tests (coverage floor enforced)
        run: |
          python3 -m venv /tmp/hf-unit
          /tmp/hf-unit/bin/pip install --quiet --require-hashes \
            -r requirements-ci.txt
          /tmp/hf-unit/bin/python -m pytest -q --cov=entrypoint \
            --cov-report=term --cov-report=json:coverage.json
          # The measured number goes into a generated file, not a markdown doc.
          /tmp/hf-unit/bin/python scripts/coverage_summary.py coverage.json
      - name: manifest.json must match the code
        run: python3 scripts/check_manifest.py

      - name: mutation spot-check (curated, security-critical)
        # mutmut's full run is unreliable under this pytest config (see the
        # script's docstring); this proves the suite kills a wrong answer in
        # key handling, validation and the hardening directives.
        run: /tmp/hf-unit/bin/python scripts/mutation_spotcheck.py

  build-and-test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: build the image locally
        run: |
          docker build \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -t sambent.dev/sam/hiddenforge:ci .

      - name: in-container torrc smoke test
        # Block scalar, not a plain scalar with a trailing backslash: YAML folds
        # a multi-line plain scalar to a single line, so the backslash became a
        # literal argument and the script path arrived mangled -- the step failed
        # with "can't open file '// /usr/local/bin/tests/test_torrc.py'" even
        # though the file is in the image. The job had never been executed.
        run: |
          docker run --rm --entrypoint python3 sambent.dev/sam/hiddenforge:ci \
            /usr/local/bin/tests/test_torrc.py

      - name: CLI machine contract
        run: |
          docker run --rm sambent.dev/sam/hiddenforge:ci version --json
          docker run --rm sambent.dev/sam/hiddenforge:ci info --json > /dev/null

      - name: vanity generator smoke (result matches the prefix)
        run: |
          mkdir -p /tmp/hf-keys && chmod 700 /tmp/hf-keys
          docker run --rm -v /tmp/hf-keys:/keys sambent.dev/sam/hiddenforge:ci \
            vanity --prefix a --name ci --out /keys --threads 2 \
            --uid "$(id -u)" --gid "$(id -g)" --json
          grep -q '^a' /tmp/hf-keys/ci/hostname

      - name: live acceptance suite (backend + emitted fragment + real .onion)
        env:
          HIDDENFORGE_E2E: "1"
          HIDDENFORGE_TEST_IMAGE: sambent.dev/sam/hiddenforge:ci
        run: |
          python3 -m venv /tmp/hf-e2e
          /tmp/hf-e2e/bin/pip install --quiet --require-hashes \
            -r requirements-ci.txt
          /tmp/hf-e2e/bin/python -m pytest tests/test_e2e_live.py -v

  security:
    # Runs on push, schedule and manual dispatch, and on a same-repo PR. The
    # schedule is the point: a push-triggered scan cannot see an advisory
    # published after the last commit.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the image to scan
        run: |
          docker build \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -t sambent.dev/sam/hiddenforge:ci .

      - name: trivy image (HIGH/CRITICAL, fixable only)
        run: |
          # --ignore-unfixed: an unfixable base-image CVE is not actionable here
          # and would make the gate permanently red. .trivyignore carries the
          # accepted findings with reasons and expiries.
          mkdir -p security-reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" \
            aquasec/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /src/.trivyignore \
            --format json --output /src/security-reports/trivy-image.json \
            sambent.dev/sam/hiddenforge:ci

      - name: trivy fs (secrets and misconfiguration)
        run: |
          mkdir -p security-reports
          docker run --rm -v "$PWD:/src" aquasec/trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 fs \
            --scanners secret,misconfig --exit-code 1 --severity HIGH,CRITICAL \
            --ignorefile /src/.trivyignore \
            --format json --output /src/security-reports/trivy-fs.json /src

      - name: semgrep (security-audit + dockerfile)
        run: |
          # The only excluded rule is the accepted root-at-PID1 design: the
          # container MUST start as root to chown the key mount and su-exec to
          # tor. See SECURITY.md. Everything else must be clean.
          docker run --rm -v "$PWD:/src" semgrep/semgrep@sha256:7acf76eaa621465588fdfcc84f46fd7ea1e8337ebb1aa1ed6f4685f6eedaec25 semgrep \
            --config=p/security-audit --config=p/dockerfile \
            --exclude-rule=dockerfile.security.missing-user-entrypoint.missing-user-entrypoint \
            --error --quiet /src

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/src" zricethezav/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 detect \
            --no-git --redact --config /src/.gitleaks.toml --source /src

      - name: Upload security reports
        # Produced even when a scan fails, so the report of a failure is kept.
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3
        with:
          name: security-reports
          path: security-reports/

  reproducibility:
    # Reproducibility silently regresses; the first person to notice is then a
    # verifier deciding whether it is a build bug or an attack. This clones
    # nothing (the checkout is the tree) and builds the SAME tree twice under the
    # documented flags, comparing the OCI index digests.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Two builds, one digest
        run: |
          set -euo pipefail
          SDE="$(git log -1 --format=%ct)"
          a="$(mktemp -d)"; b="$(mktemp -d)"
          for pair in "A $a" "B $b"; do
            set -- $pair
            docker buildx build --platform linux/amd64 --provenance=false \
              --build-arg SOURCE_DATE_EPOCH="$SDE" \
              --output "type=oci,dest=$2/out.tar,rewrite-timestamp=true" .
          done
          da="$(tar -xOf "$a/out.tar" index.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["manifests"][0]["digest"])')"
          db="$(tar -xOf "$b/out.tar" index.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["manifests"][0]["digest"])')"
          echo "build A: $da"
          echo "build B: $db"
          if [ "$da" != "$db" ]; then
            echo "NOT REPRODUCIBLE -- same source, same SOURCE_DATE_EPOCH, different index digest"
            exit 1
          fi
          echo "REPRODUCIBLE: $da"
          # --provenance=false is load-bearing: buildx stamps wall-clock times into
          # the SLSA attestation, which lives inside the index. amd64-only here;
          # the release index is multi-platform and necessarily differs, but the
          # property is the same.

  pin-freshness:
    # Pinned apk versions are CVE-driven and bumped by hand, which is right:
    # a crypto/anonymity bump is a reviewed decision. What is NOT acceptable is a
    # pin silently disappearing -- `tor=0.4.9.11-r0` was pruned by Alpine and left
    # this repo unbuildable with no warning. This reports that daily.
    #
    # It fails only when a pinned version is GONE (exit 2). A newer version being
    # available is printed, not fatal: bumping is a human decision, and a job that
    # opens that door automatically would be a supply-chain risk of its own.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Every pinned apk version still exists upstream
        run: python3 scripts/check_pins.py
