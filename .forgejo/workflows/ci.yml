# Forgejo Actions CI for HiddenForge.
#
# Runs on the project's Forgejo instance (sambent.dev). Not GitHub, not Docker Hub.
# Workflows live in .forgejo/ (the Forgejo-native path; Forgejo also reads
# .github/workflows for compatibility).
#
# Jobs target the self-hosted runner labelled `docker`. Publishing the built
# image and signing its digest are separate, deliberate local steps (signing
# needs a hardware key), so they are not in this file.
#
# TRUST BOUNDARY: the runner is HOST-MODE, so a job executes as the operator on
# the workstation. Every job therefore carries a guard that runs only for a
# push or for a pull request whose head is THIS repository -- a fork PR must
# never get host code execution. The guard is fail-closed: if the context does
# not expose `pull_request.head.repo`, the job is skipped rather than run.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Daily, so an advisory published after the last commit is caught even when
    # nothing is being pushed. A push-triggered scan cannot see that.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: hadolint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: python syntax (every shipped .py plus the extensionless CLI)
        run: |
          python3 -m py_compile entrypoint.py healthcheck.py vanity.py
          python3 -m py_compile scripts/hiddenforge
      - name: lint + type toolchain
        run: |
          python3 -m venv /tmp/hf-lint
          /tmp/hf-lint/bin/pip install --quiet ruff==0.15.16 mypy==2.2.0
      - name: ruff
        run: |
          # scripts/hiddenforge has no .py extension, so it must be named
          # explicitly: `ruff check .` silently skips it.
          /tmp/hf-lint/bin/ruff check . scripts/hiddenforge
          /tmp/hf-lint/bin/ruff check scripts/check_manifest.py scripts/coverage_summary.py
      - name: mypy (sources AND tests, including the extensionless CLI)
        run: MYPY=/tmp/hf-lint/bin/mypy sh scripts/typecheck.sh

  unit:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: host unit + property tests (coverage floor enforced)
        run: |
          python3 -m venv /tmp/hf-unit
          /tmp/hf-unit/bin/pip install --quiet \
            pytest==9.0.3 hypothesis==6.155.1 coverage==7.14.1 pytest-cov==7.1.0
          /tmp/hf-unit/bin/python -m pytest -q --cov=entrypoint \
            --cov-report=term --cov-report=json:coverage.json
          # The measured number goes into a generated file, not a markdown doc.
          /tmp/hf-unit/bin/python scripts/coverage_summary.py coverage.json
      - name: manifest.json must match the code
        run: python3 scripts/check_manifest.py

      - name: mutation spot-check (curated, security-critical)
        # mutmut's full run is unreliable under this pytest config (see the
        # script's docstring); this proves the suite kills a wrong answer in
        # key handling, validation and the hardening directives.
        run: /tmp/hf-unit/bin/python scripts/mutation_spotcheck.py

  build-and-test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: build the image locally
        run: |
          docker build \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -t sambent.dev/sam/hiddenforge:ci .

      - name: in-container torrc smoke test
        run: docker run --rm --entrypoint python3 sambent.dev/sam/hiddenforge:ci \
               /usr/local/bin/tests/test_torrc.py

      - name: CLI machine contract
        run: |
          docker run --rm sambent.dev/sam/hiddenforge:ci version --json
          docker run --rm sambent.dev/sam/hiddenforge:ci info --json > /dev/null

      - name: vanity generator smoke (result matches the prefix)
        run: |
          mkdir -p /tmp/hf-keys && chmod 700 /tmp/hf-keys
          docker run --rm -v /tmp/hf-keys:/keys sambent.dev/sam/hiddenforge:ci \
            vanity --prefix a --name ci --out /keys --threads 2 \
            --uid "$(id -u)" --gid "$(id -g)" --json
          grep -q '^a' /tmp/hf-keys/ci/hostname

      - name: live acceptance suite (backend + emitted fragment + real .onion)
        env:
          HIDDENFORGE_E2E: "1"
          HIDDENFORGE_TEST_IMAGE: sambent.dev/sam/hiddenforge:ci
        run: |
          python3 -m venv /tmp/hf-e2e
          /tmp/hf-e2e/bin/pip install --quiet pytest==9.0.3
          /tmp/hf-e2e/bin/python -m pytest tests/test_e2e_live.py -v

  security:
    # Runs on push, schedule and manual dispatch, and on a same-repo PR. The
    # schedule is the point: a push-triggered scan cannot see an advisory
    # published after the last commit.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Build the image to scan
        run: |
          docker build \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -t sambent.dev/sam/hiddenforge:ci .

      - name: trivy image (HIGH/CRITICAL, fixable only)
        run: |
          # --ignore-unfixed: an unfixable base-image CVE is not actionable here
          # and would make the gate permanently red. .trivyignore carries the
          # accepted findings with reasons and expiries.
          mkdir -p security-reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" \
            aquasec/trivy:0.58.1 image \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /src/.trivyignore \
            --format json --output /src/security-reports/trivy-image.json \
            sambent.dev/sam/hiddenforge:ci

      - name: trivy fs (secrets and misconfiguration)
        run: |
          mkdir -p security-reports
          docker run --rm -v "$PWD:/src" aquasec/trivy:0.58.1 fs \
            --scanners secret,misconfig --exit-code 1 --severity HIGH,CRITICAL \
            --ignorefile /src/.trivyignore \
            --format json --output /src/security-reports/trivy-fs.json /src

      - name: semgrep (security-audit + dockerfile)
        run: |
          # The only excluded rule is the accepted root-at-PID1 design: the
          # container MUST start as root to chown the key mount and su-exec to
          # tor. See SECURITY.md. Everything else must be clean.
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.100.0 semgrep \
            --config=p/security-audit --config=p/dockerfile \
            --exclude-rule=dockerfile.security.missing-user-entrypoint.missing-user-entrypoint \
            --error --quiet /src

      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/src" zricethezav/gitleaks:v8.28.0 detect \
            --no-git --redact --config /src/.gitleaks.toml --source /src

      - name: Upload security reports
        # Produced even when a scan fails, so the report of a failure is kept.
        if: always()
        uses: forgejo/upload-artifact@v3
        with:
          name: security-reports
          path: security-reports/
