# Forgejo Actions CI for HiddenForge.
#
# Runs on the project's Forgejo instance (sambent.dev). Actions are fetched from
# github.com and code.forgejo.org by full URL; scanner images from the project's
# own registry, by digest (see below).
# Workflows live in .forgejo/ (the Forgejo-native path; Forgejo also reads
# .github/workflows for compatibility).
#
# Jobs target the self-hosted runner labelled `docker`. Publishing the built
# image and signing its digest are separate, deliberate local steps (signing
# needs a hardware key), so they are not in this file.
#
# TRUST BOUNDARY: the runner is HOST-MODE, so a job executes as the operator on
# the workstation. Every job therefore carries a guard that runs only for a
# push or for a pull request whose head is THIS repository -- a fork PR must
# never get host code execution. The guard is fail-closed: if the context does
# not expose `pull_request.head.repo`, the job is skipped rather than run.
#
# PINNING: every `uses:` is FULLY QUALIFIED (host and repository) and pinned to
# a commit SHA (the tag is in a trailing comment for humans), and every scanner
# container is pinned by digest, exactly as the Dockerfile pins the base image
# and the vendored mkp224o tarball. A tag is a mutable dependency with write
# access to this build.
#
# The host is part of the pin. A short name like `actions/checkout` resolves
# against the instance's DEFAULT_ACTIONS_URL, a value this repository cannot
# read, so the pin would only be as reproducible as an out-of-band setting. All
# of them are therefore written as full URLs: `actions/checkout` from
# github.com, `forgejo/upload-artifact` from code.forgejo.org (it does not exist
# on github.com).
#
# Every tool CONTAINER comes from the project's own registry
# (sambent.dev/sambent/hf-tools-*), copied byte for byte from its publisher: the
# digest here is the publisher's digest, so a copy that differed would not
# match. trivy and grype still download their vulnerability databases from
# their publishers at run time; a scan against a stale local copy would be the
# worse risk.
name: ci

on:
  push:
    branches: ["**"]
    # Tags too: tagging is the release trigger, and the live E2E must run against
    # the tagged commit. Do not publish the image until this run is green --
    # a tag whose CI never ran (or failed) must not become an image.
    tags: ["v*"]
  pull_request:
  schedule:
    # Daily, so an advisory published after the last commit is caught even when
    # nothing is being pushed. A push-triggered scan cannot see that.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 3.0 builds offline from the verified input archive (DHI packages, the Tor
# release tarball, the vendored libc crate). Its location on the runner host is
# a repository variable, never a path hard-coded here; scripts/build_inputs.py
# checks every file against its publisher's signature before a build uses it.
env:
  HIDDENFORGE_INPUTS: ${{ vars.HIDDENFORGE_INPUTS }}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: hadolint Dockerfile
        # hadolint from the project's own registry, by digest (the image the
        # upstream action wraps); .hadolint.yaml says which rules cannot apply.
        run: |
          docker run --rm -i -v "$PWD/.hadolint.yaml:/cfg.yaml:ro" \
            sambent.dev/sambent/hf-tools-hadolint@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552 \
            hadolint -c /cfg.yaml --failure-threshold warning - < Dockerfile
      - name: python syntax (the 2.x reference sources, the host CLI, the tools)
        run: |
          python3 -m py_compile entrypoint.py healthcheck.py vanity.py
          python3 -m py_compile scripts/hiddenforge scripts/build_inputs.py wizard/build.py
      - name: rust (fmt, clippy with warnings as errors)
        run: |
          cd hiddenforge-rs
          cargo fmt --check
          cargo clippy --release --locked --all-targets -- -D warnings
      - name: wizard is built from its sources and its script parses
        run: |
          node --check wizard/render.js
          node --check wizard/ui.js
          python3 wizard/build.py --check
      - name: lint + type toolchain
        run: |
          python3 -m venv --clear /tmp/hf-lint
          # pytest and hypothesis are REQUIRED, not optional: typecheck.sh
          # checks tests/ as well as the sources (that is the point of it), and
          # without them mypy reports 12 import-not-found errors and the job
          # fails. Locally this was invisible because the dev venv has them.
          #
          # --require-hashes with requirements-ci.txt: the tooling that JUDGES
          # the image is fetched with the same integrity as the image's own
          # dependencies (the Dockerfile already installs that way). All three
          # CI venvs install from the one file, so they cannot drift apart.
          /tmp/hf-lint/bin/pip install --quiet --require-hashes \
            -r requirements-ci.txt
      - name: ruff
        run: |
          # scripts/hiddenforge has no .py extension, so it must be named
          # explicitly: `ruff check .` silently skips it.
          /tmp/hf-lint/bin/ruff check . scripts/hiddenforge
          /tmp/hf-lint/bin/ruff check scripts/check_manifest.py scripts/coverage_summary.py
      - name: mypy (sources AND tests, including the extensionless CLI)
        run: MYPY=/tmp/hf-lint/bin/mypy sh scripts/typecheck.sh
      - name: version consistency
        run: python3 tests/test_version_consistency.py
      - name: shipped compose files parse
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f podman-compose.yml config -q

  unit:
    name: unit
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: host unit + property tests (coverage floor enforced)
        run: |
          python3 -m venv --clear /tmp/hf-unit
          /tmp/hf-unit/bin/pip install --quiet --require-hashes \
            -r requirements-ci.txt
          /tmp/hf-unit/bin/python -m pytest -q --cov=entrypoint \
            --cov-report=term --cov-report=json:coverage.json
          # The measured number goes into a generated file, not a markdown doc.
          /tmp/hf-unit/bin/python scripts/coverage_summary.py coverage.json
      - name: rust unit tests, then the Rust-vs-2.x and wizard-vs-setup differential tests
        run: |
          ( cd hiddenforge-rs && cargo test --release --locked && cargo build --release --locked )
          /tmp/hf-unit/bin/python -m pytest -q tests/rust tests/test_wizard_diff.py
      - name: manifest.json must match the code
        run: python3 scripts/check_manifest.py

      - name: mutation spot-check (scripts/hiddenforge)
        # The operator CLI is the one Python file that still ships. This proves
        # the suite kills a wrong answer in its backup, restore and image-reference
        # handling. The Rust runtime's mutation testing runs on request, not here.
        run: /tmp/hf-unit/bin/python scripts/mutation_spotcheck.py

  build-and-test:
    name: build-and-test
    timeout-minutes: 30
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: verify the build inputs
        run: |
          test -n "$HIDDENFORGE_INPUTS" || { echo "set the HIDDENFORGE_INPUTS repository variable"; exit 1; }
          python3 scripts/build_inputs.py verify "$HIDDENFORGE_INPUTS"

      - name: build the image locally
        run: |
          docker build \
            --build-context inputs="$HIDDENFORGE_INPUTS" \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -t sambent.dev/sam/hiddenforge:ci .

      - name: in-container torrc smoke test (generated by the runtime, accepted by Tor)
        run: |
          set -euo pipefail
          docker run --rm -e MYAPP_TOR_SERVICE_HOSTS=80:10.0.0.2:8080 \
            --entrypoint /usr/local/bin/hiddenforge sambent.dev/sam/hiddenforge:ci torrc-preview \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["content"],end="")' \
            | sed 's#/var/lib/tor/hidden_service/myapp#/tmp/hs/myapp#' > "$RUNNER_TEMP/torrc"
          grep -q '^HiddenServicePort 80 10.0.0.2:8080$' "$RUNNER_TEMP/torrc"
          grep -q '^Sandbox 1 ' "$RUNNER_TEMP/torrc"
          chmod 0644 "$RUNNER_TEMP/torrc"   # read by uid 65532 below
          docker run --rm --entrypoint /usr/bin/tor -v "$RUNNER_TEMP/torrc:/t:ro" \
            --tmpfs /tmp:uid=65532 --tmpfs /var/lib/tor:uid=65532,mode=0700 --user 65532 \
            sambent.dev/sam/hiddenforge:ci --verify-config -f /t

      - name: 2.x compatibility forms still answer (no shell, no Python in the image)
        run: |
          set -euo pipefail
          img=sambent.dev/sam/hiddenforge:ci
          docker run --rm --entrypoint su-exec "$img" tor true
          # `! cmd` never trips `set -e`, so a shell that answered would pass
          # silently. Test the refusal explicitly.
          if docker run --rm --entrypoint sh "$img" -c id; then
            echo "FAIL: sh -c answered: the image has a general-purpose shell"; exit 1
          fi
          if docker run --rm --entrypoint python3 "$img" -c 'print(1)'; then
            echo "FAIL: python3 -c answered: the image has a Python interpreter"; exit 1
          fi
          docker run --rm --entrypoint /usr/local/bin/hiddenforge "$img" version --json

      - name: CLI machine contract (as root and as the tor user)
        run: |
          set -euo pipefail
          docker run --rm sambent.dev/sam/hiddenforge:ci version --json
          docker run --rm sambent.dev/sam/hiddenforge:ci info --json > /dev/null
          # The tor user must be able to read everything the image ships for it
          # (2.1.1 shipped a 0644 /opt/hiddenforge that only root could enter).
          docker run --rm --user 100:101 sambent.dev/sam/hiddenforge:ci info --json > /dev/null

      - name: vanity generator smoke (result matches the prefix)
        run: |
          # A FRESH directory per run, not a fixed /tmp path. On a
          # self-hosted runner /tmp survives between jobs, so the second run
          # found the first run's key and `vanity` refused it -- correctly, a
          # key IS the .onion address and there is no recovery -- and the job
          # failed for a reason that had nothing to do with the commit. Passing
          # --force instead would have hidden exactly the refusal worth having.
          KEYS=$(mktemp -d)
          chmod 700 "$KEYS"
          trap 'find "$KEYS" -mindepth 1 -delete 2>/dev/null || :; rmdir "$KEYS" 2>/dev/null || :' EXIT
          docker run --rm -v "$KEYS":/keys sambent.dev/sam/hiddenforge:ci \
            vanity --prefix a --name ci --out /keys --threads 2 \
            --uid "$(id -u)" --gid "$(id -g)" --json
          grep -q '^a' "$KEYS/ci/hostname"

      - name: live acceptance suite (backend + emitted fragment + real .onion)
        env:
          HIDDENFORGE_E2E: "1"
          HIDDENFORGE_TEST_IMAGE: sambent.dev/sam/hiddenforge:ci
        run: |
          python3 -m venv --clear /tmp/hf-e2e
          /tmp/hf-e2e/bin/pip install --quiet --require-hashes \
            -r requirements-ci.txt
          /tmp/hf-e2e/bin/python -m pytest tests/test_e2e_live.py -v

  security:
    name: security
    timeout-minutes: 30
    # Runs on push, schedule and manual dispatch, and on a same-repo PR. The
    # schedule is the point: a push-triggered scan cannot see an advisory
    # published after the last commit.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history, for gitleaks: a secret in any past commit is public
          # for as long as the repository is.
          fetch-depth: 0

      - name: Build the image to scan
        run: |
          docker build \
            --build-context inputs="$HIDDENFORGE_INPUTS" \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" \
            -t sambent.dev/sam/hiddenforge:ci .

      - name: trivy image (every severity, fixed or not)
        run: |
          # 3.0 ships at zero: every severity and unfixed findings too. A finding
          # is a red build, not a filtered one.
          mkdir -p security-reports
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" \
            sambent.dev/sambent/hf-tools-trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 image \
            --exit-code 1 --scanners vuln \
            --format json --output /src/security-reports/trivy-image.json \
            sambent.dev/sam/hiddenforge:ci

      - name: grype image (a second scanner, a second database)
        run: |
          # trivy reported 0 for 2.1.6 while grype found 19: one scanner's
          # database is a blind spot, so both must agree on zero.
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            sambent.dev/sambent/hf-tools-grype@sha256:6a36234da13f9faa327306ac0b3dab3405cfa2b4eb20c8f904125a8707863913 \
            docker:sambent.dev/sam/hiddenforge:ci --fail-on negligible

      - name: trivy fs (secrets and misconfiguration)
        run: |
          mkdir -p security-reports
          docker run --rm -v "$PWD:/src" sambent.dev/sambent/hf-tools-trivy@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 fs \
            --scanners secret,misconfig --exit-code 1 --severity HIGH,CRITICAL \
            --ignorefile /src/.trivyignore \
            --format json --output /src/security-reports/trivy-fs.json /src

      - name: semgrep (security-audit + dockerfile)
        run: |
          # The only excluded rule is the accepted root-at-PID1 design: the
          # container MUST start as root to chown the key mount and su-exec to
          # tor. See SECURITY.md. Everything else must be clean.
          docker run --rm -v "$PWD:/src" sambent.dev/sambent/hf-tools-semgrep@sha256:7acf76eaa621465588fdfcc84f46fd7ea1e8337ebb1aa1ed6f4685f6eedaec25 semgrep \
            --config=p/security-audit --config=p/dockerfile \
            --exclude-rule=dockerfile.security.missing-user-entrypoint.missing-user-entrypoint \
            --error --quiet /src

      - name: gitleaks (every commit, then the working tree)
        run: |
          # --no-git alone scans only the checked-out files, so a secret that
          # was committed and later deleted would pass. The history scan is the
          # one that matters for a public repository; the tree scan also covers
          # anything the build left untracked.
          docker run --rm -v "$PWD:/src" sambent.dev/sambent/hf-tools-gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 detect \
            --redact --config /src/.gitleaks.toml --source /src --log-opts="--all"
          docker run --rm -v "$PWD:/src" sambent.dev/sambent/hf-tools-gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 detect \
            --no-git --redact --config /src/.gitleaks.toml --source /src

      - name: Upload security reports
        # Produced even when a scan fails, so the report of a failure is kept.
        if: always()
        uses: https://code.forgejo.org/forgejo/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3
        with:
          name: security-reports
          path: security-reports/

  reproducibility:
    name: reproducibility
    timeout-minutes: 30
    # Reproducibility silently regresses; the first person to notice is then a
    # verifier deciding whether it is a build bug or an attack. This builds the
    # checked-out commit twice, each time from a fresh clone made under a
    # different umask (007, then the common 022), and compares the OCI index
    # digests. Two builds of the one checkout under one umask cannot see a file
    # mode leaking from the builder's environment into a layer, which is
    # exactly how 2.1.0 failed to reproduce for a builder with umask 022.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Two builds from two clones under two umasks, one digest
        run: |
          set -euo pipefail
          SDE="$(git log -1 --format=%ct)"
          scratch="$(mktemp -d)"
          # The runner is host mode: scratch left here stays on the host.
          trap 'rm -rf "$scratch"' EXIT
          for u in 007 022; do
            # --no-hardlinks: a clone that shares object files with the
            # checkout is not independent of it.
            ( umask "$u"
              git clone --quiet --no-hardlinks "$PWD" "$scratch/src-$u"
              cd "$scratch/src-$u"
              # --no-cache: a second build served from the first one's cache
              # reports a match it did not earn.
              docker buildx build --no-cache --platform linux/amd64 \
                --provenance=false --sbom=false \
                --build-context inputs="$HIDDENFORGE_INPUTS" \
                --build-arg SOURCE_DATE_EPOCH="$SDE" \
                --output "type=oci,dest=$scratch/out-$u.tar,rewrite-timestamp=true" . )
          done
          digest() { tar -xOf "$1" index.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["manifests"][0]["digest"])'; }
          da="$(digest "$scratch/out-007.tar")"
          db="$(digest "$scratch/out-022.tar")"
          echo "umask 007: $da"
          echo "umask 022: $db"
          if [ "$da" != "$db" ]; then
            echo "NOT REPRODUCIBLE -- same commit, same SOURCE_DATE_EPOCH, different index digest"
            exit 1
          fi
          echo "REPRODUCIBLE: $da"
          # --provenance=false and --sbom=false are load-bearing: buildx stamps
          # wall-clock times into those attestations, which live inside the
          # index. amd64-only here; the release index is two-platform and its
          # digest differs, but the property is the same.

  inputs-integrity:
    name: inputs-integrity (nightly)
    timeout-minutes: 20
    # 3.0 builds from an archive of exactly the inputs a release used, so an
    # upstream pruning a version can no longer break the build (it broke 2.x
    # five times). What still needs watching daily: that the archive is intact
    # and still verifies against its publishers' signatures, and whether Tor
    # Project has released a newer stable (old Tor is the risk; bumping is a
    # reviewed decision, so a newer release is reported, not applied).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: docker
    steps:
      - uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Every build input still verifies
        run: python3 scripts/build_inputs.py verify "$HIDDENFORGE_INPUTS"

      - name: Is there a newer Tor stable?
        run: |
          pinned="$(grep -o 'tor-[0-9.]*\.tar\.gz' Dockerfile | head -1)"
          latest="$(curl -fsS https://dist.torproject.org/ | grep -o 'tor-0\.[0-9.]*\.tar\.gz' | sort -uV | tail -1)"
          echo "pinned: $pinned  latest: $latest"
          [ "$pinned" = "$latest" ] || echo "::warning::Tor $latest is out; this build pins $pinned"
