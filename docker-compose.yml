# HiddenForge: production-ready compose file
#
# USAGE:
#   1. Copy this file and make the two edits marked <-- EDIT (the service name,
#      which appears twice, and the backend image)
#   2. mkdir -p ./tor-keys
#   3. docker compose up -d
#   4. docker compose exec tor hiddenforge show --name myapp
#      (replace "myapp" with whatever you used in step 1)
#
# All security flags are pre-configured. Do not remove them.
#
# Docker and Podman differ in a few settings; see the table in
# docs/INTEGRATION.md. This file tracks :latest. Run `hiddenforge verify-image`
# before you deploy, and pin the verified digest if you want it to stay put.

networks:
  # tor-internal: isolated network. Only tor and your backend live here.
  # The backend has NO internet access and is NOT reachable from outside.
  tor-internal:
    internal: true

  # tor-external: gives the tor container outbound internet so it can
  # reach the Tor network. Your backend never touches this network.
  tor-external:

services:
  tor:
    image: sambent.dev/sam/hiddenforge:latest
    restart: unless-stopped

    # ── Security flags ────────────────────────────────────────────────────
    cap_drop:
      - ALL                        # drop every Linux capability
    cap_add:
      - CHOWN        # transfer ownership of hidden_service dir to the tor user
      - DAC_OVERRIDE # create service subdirs inside the host-owned bind mount
      - FOWNER       # chmod service dirs that are owned by the host user
      - SETUID       # drop from root to the tor user to run the Tor daemon
      - SETGID       # drop from root to the tor group to run the Tor daemon
    security_opt:
      - no-new-privileges:true     # prevent privilege escalation via setuid
      # NO seccomp=unconfined. Tor's Sandbox 1 is an IN-PROCESS filter covering
      # Tor alone, so running unconfined left the root supervisor with no
      # syscall filter for the container's whole life. Docker's default profile
      # stacks underneath Tor's (measured: two filters on the Tor process), and
      # a discovery run with the profile in SCMP_ACT_LOG mode recorded ZERO
      # syscalls outside its allow list. The earlier clone3/statx justification
      # here was wrong; it was never reproduced.
      - apparmor=docker-default    # explicit: keep Docker's default AppArmor MAC
    read_only: true                # container filesystem is read-only
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /etc/tor:rw,noexec,nosuid,nodev,size=8m
      # uid=100,gid=101: Tor process runs as the tor user (uid 100) after the supervisor drops
      # privileges; the DataDirectory must be owned by that user or Tor refuses to start.
      - /var/lib/tor:rw,noexec,nosuid,nodev,size=64m,uid=100,gid=101,mode=0700
      # Note: the bind mount below overlays /var/lib/tor/hidden_service so keys persist.

    # ── Resource limits (DoS / fork-bomb / fd-exhaustion containment) ──────
    # Tor, the supervisor, the upload watcher and the guard monitor are a
    # low-process, modest-memory workload. memswap_limit == mem_limit disables swap so key material is
    # never paged to disk (consistent with AvoidDiskWrites 1 in the torrc).
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256
    ulimits:
      nofile:                      # Tor opens many sockets under load
        soft: 8192
        hard: 8192
      # NOTE: `nproc` is deliberately NOT set here. RLIMIT_NPROC is counted per
      # HOST uid, and the tor user is uid 100, which other containers share
      # (i2pforge's i2pd is also uid 100). On a host already running >= the
      # limit as uid 100, the drop to the tor user (setuid) fails with EAGAIN ("Resource
      # temporarily unavailable") and Tor never starts. The only symptom is a
      # restart loop with no logs. Fork-bomb containment comes from
      # `pids_limit` instead, which is a per-container cgroup and does not
      # depend on what else is on the host.

    # ── Health ───────────────────────────────────────────────────────────
    # Declared here, not only in the image. The image's HEALTHCHECK is a Docker
    # extension to the image config; the OCI image format has no such field, and
    # Podman ignores it on OCI images. Measured: `podman inspect` showed no
    # healthcheck at all for the published image, so a wedged Tor or a dead
    # guard monitor was never reported. Compose-level healthchecks work on both.
    healthcheck:
      test: ["CMD", "hiddenforge", "healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3

    # ── Suppress host-side log file ───────────────────────────────────────
    # Docker writes container stdout to a JSON file on the host by default.
    # Setting driver: none prevents that log file from being written, which
    # is consistent with Tor's AvoidDiskWrites setting inside the container.
    # Remove this block if you need logs for debugging.
    logging:
      driver: none

    environment:
      # <-- EDIT: change "MYAPP" to your service name (lowercase, hyphens ok)
      # The entrypoint resolves Docker service names automatically, so no static IPs are needed.
      # Format: "onion_port:service_name:backend_port"
      # Multiple ports: "80:web:80,443:web:443"
      MYAPP_TOR_SERVICE_HOSTS: "80:web:80"   # <-- EDIT (change MYAPP)

    volumes:
      # Hidden service keys persist here across container restarts.
      # Back this directory up. Losing it means losing your .onion address.
      - ./tor-keys:/var/lib/tor/hidden_service

    networks:
      - tor-internal   # to reach the backend
      - tor-external   # to reach the Tor network

    # No DNS leaves this container. Docker's resolver still answers backend
    # names on the internal network, but forwards any name it cannot answer to
    # the host's upstream DNS, so a backend that is down or not up yet would be
    # announced there, in step with the onion's outages. Tor needs no DNS (it
    # bootstraps from relay IPs); a loopback server nothing listens on ends it.
    dns: 127.0.0.1

    depends_on:
      - web

  # ── Your backend service ──────────────────────────────────────────────────
  # Replace this with your actual application. The key constraints:
  #   - NO 'ports:' mapping: the backend must never be internet-exposed
  #   - Only connect to tor-internal, not tor-external
  web:
    # <-- EDIT: replace with your actual image. This nginx is an example backend,
    # pinned by digest; use your own pinned image.
    image: nginx:alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN        # nginx needs these to set up its worker processes
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m
      - /var/run:rw,noexec,nosuid,nodev,size=8m
    # Modest limits for the example backend; tune to your real app.
    pids_limit: 256
    networks:
      - tor-internal   # reachable by tor, NOT reachable from the internet
