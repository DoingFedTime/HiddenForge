# HiddenForge — tooling config (tests, coverage, lint).
# This file configures DEV tooling only. It is not installed into the image.

[tool.pytest.ini_options]
testpaths = ["tests"]
# test_torrc.py is the in-CONTAINER smoke test (needs the 'tor' user + /etc/tor);
# it is not collected in the host unit run.
addopts = "-q --import-mode=importlib"
python_files = ["test_*.py"]
# Extend (not replace) pytest's defaults: keep the dotfile/egg ignores and add golden/.
norecursedirs = ["golden", ".*", "build", "dist", "*.egg", "node_modules"]

[tool.coverage.run]
branch = true
source = ["entrypoint"]

[tool.coverage.report]
show_missing = true
# Coverage floor: CI fails if the pure-surface coverage regresses below this.
# `source` is entrypoint.py only. The uncovered remainder is the privileged
# startup that cannot run on the host (chown/chmod of /etc/tor and the data dir,
# su-exec wiring), exercised by the container smoke test and the live E2E suite.
# The CLI (scripts/hiddenforge), vanity.py and healthcheck.py have their own
# suites in tests/test_cli.py, tests/test_vanity.py and tests/test_backup.py but
# are not in `source`.
#
# The measured number is emitted by CI as coverage.json / coverage.txt (see the
# unit job and scripts/coverage_summary.py), never written here. The floor was
# 48 against 57.9% -- ten points of room for a silent regression; covering the
# supervision loop took it to ~76%, and the floor moved up with it.
fail_under = 72
# The supervision loop / signal handler / Vanguards management are integration
# surface, not unit surface — excluded from the unit coverage gate honestly
# rather than faked with mocks.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E/F/W pyflakes+pycodestyle, B bugbear, S flake8-bandit subset, UP pyupgrade,
# RUF ruff-native, PLW pylint-warnings, SIM flake8-simplify, PERF perflint
select = ["E", "F", "W", "B", "S", "UP", "RUF", "PLW", "SIM", "PERF"]

[tool.ruff.lint.per-file-ignores]
# entrypoint.py is a privileged container supervisor; these rules flag
# choices that are INTENTIONAL and security-relevant, justified per line:
#   S110 — best-effort process kill in the signal handler (swallowing errors
#          during shutdown is deliberate; we are already terminating).
#   S103 — chmod 0o755 on the parent hidden_service dir is required so the tor
#          user (uid 100) can traverse a root-owned bind mount under rootless
#          Podman. The service dirs themselves are 0o700.
#   S603/S607 — subprocess calls to su-exec/tor by name with FIXED, validated
#          argument lists and shell=False. No untrusted input reaches argv;
#          partial paths resolve against the container's controlled PATH.
#   PLW0603 — the two module-level process handles exist so signal_handler() can
#          terminate both children; they are the one deliberate use of `global`.
"entrypoint.py" = ["S110", "S103", "S603", "S606", "S607", "PLW0603"]
# vanity.py runs a FIXED mkp224o argv (no shell, no untrusted input); S105/S108
# are false positives on a key *filename* constant and the manifest's tmpfs path.
"vanity.py" = ["S105", "S603", "S606", "S607", "S108"]
# mutation_gate.py's allowlist is keyed on VERBATIM source lines from the mutated
# file; wrapping them would make the keys unreadable and easy to mistranscribe, and
# they have to match the generated text exactly to work at all.
"scripts/mutation_gate.py" = ["E501", "S603", "S607"]
# scripts/hiddenforge invokes docker/gpg/age by name with fixed argv (S603/S607),
# chmods the generated deploy.sh 0755 (S103), names a key file constant (S105),
# and carries /tmp paths as manifest data (S108).
"scripts/*" = ["S103", "S105", "S108", "S603", "S606", "S607", "S102"]
# Tests legitimately use bare asserts (S101) and set sys.path before importing
# the module under test (E402, in the in-container smoke test).
"tests/*" = ["S101", "E402", "S603", "S607", "PLW1510", "S102"]
# Fuzz targets assert invariants; that is their job (S101).
"fuzz/*" = ["S101"]

[tool.mutmut]
# mutmut 3.5.0 (the pinned dev venv) reads `paths_to_mutate`. A newer mutmut
# deprecates it in favour of `source_paths`; when the dev dependency is bumped,
# switch and re-verify, or this silently stops finding the code to mutate.
# Every Python source that ships INSIDE the image. scripts/hiddenforge is the
# fourth and is deliberately absent: mutmut only mutates files ending in .py
# (mutmut/__main__.py: walk_source_files, should_ignore_for_mutation), and the
# CLI is an extensionless script. Its coverage is tests/test_cli.py plus the
# curated kill-check in scripts/mutation_spotcheck.py.
paths_to_mutate = ["entrypoint.py", "healthcheck.py", "vanity.py"]

[tool.mypy]
# A bare `mypy .` checks what scripts/typecheck.sh checks. fuzz/ runs under
# atheris, which is not installed on the host, so its types cannot be resolved
# there; mutants/ is mutmut's working copy of the tree, not source.
exclude = ["^fuzz/", "^mutants/"]
