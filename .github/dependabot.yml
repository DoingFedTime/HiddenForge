# Automated dependency-update PRs. Addresses the class of bug where a pinned
# dependency silently rots (the tor apk pin that broke HEAD). Dependabot opens a
# PR when a newer version exists; CI (build + smoke + scan) then proves the bump
# is safe before you merge.
#
# Scope note: Dependabot updates the Dockerfile FROM base-image digest, the
# GitHub Actions SHA pins, and the pip requirements (versions + hashes). It does
# NOT track the apk version pins inside the Dockerfile (tor/python3/su-exec) —
# those are covered by the weekly scheduled rebuild in build.yml, which fails
# when an apk pin is pruned from the Alpine index.
version: 2
updates:
  # GitHub Actions — bumps the SHA pins (and the trailing # vX.Y.Z comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  # Dockerfile base image — bumps the digest-pinned alpine FROM line.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

  # Python deps in requirements.txt — bumps versions AND --require-hashes hashes.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
