name: Build & Test

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  # Weekly rebuild so apk pin drift (an exact -rN pruned from the Alpine index)
  # fails here on a schedule instead of silently at release time. Runs the full
  # build + smoke + scan against the current mirror index. The scheduled run
  # also triggers the scan-published job below (published-image CVE rescan).
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:       # allow an on-demand published-image rescan

# SUPPLY CHAIN: every third-party action is pinned to an immutable ref — a full
# commit SHA for git actions, or an image digest (@sha256:...) for the actionlint
# container action. A tag is mutable and can be re-pointed at malicious code; a
# SHA/digest cannot. The trailing "# vX.Y.Z" comment records the human-readable
# release the pin maps to. To bump a git action, resolve the new tag to the
# COMMIT it points to with:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq '.sha'
# (the commits endpoint auto-dereferences annotated tags — do NOT use
# git/ref/tags/<tag>.object.sha, which returns the tag object, not the commit),
# then update both the SHA and the comment.

permissions:
  contents: read

# One in-flight run per ref. A newer push cancels the older, still-running build
# (saves runner time and avoids stale red/green). Keyed by workflow+ref so tags,
# branches, and PRs never cancel each other.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast static gates
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: pip install ruff bandit
      - name: ruff
        run: ruff check entrypoint.py healthcheck.py tests/
      - name: bandit (no High severity allowed)
        run: bandit -r entrypoint.py healthcheck.py -lll
      - name: hadolint (Dockerfile)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with:
          dockerfile: Dockerfile
      - name: actionlint
        # rhysd/actionlint ships NO action (its only action.yml files are test
        # fixtures under testdata/), so `uses: rhysd/actionlint@main` fails at
        # runtime. Use the official actionlint container, digest-pinned like the
        # Alpine base. The container exits non-zero on findings, so this is a
        # real CI gate on every event (push/PR/schedule) with no token needed.
        # Digest = rhysd/actionlint:1.7.12.
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  # Unit + property/fuzz tests
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest pytest-cov hypothesis
      - name: Run host unit + fuzz suite
        run: pytest --cov=entrypoint --cov-branch --cov-report=term-missing -p no:cacheprovider

  # Build image, smoke test under Docker
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Build image
        run: docker build -t hiddenforge:ci .
      - name: Smoke - torrc generation (in-container test)
        run: |
          docker run --rm --entrypoint python3 \
            -e SERVICE_TOR_SERVICE_HOSTS="80:127.0.0.1:8080" \
            -v /tmp/hs-test:/var/lib/tor/hidden_service \
            hiddenforge:ci /usr/local/bin/tests/test_torrc.py
      - name: Smoke - tor --verify-config accepts the generated torrc
        run: |
          docker run --rm --entrypoint sh \
            -e SERVICE_TOR_SERVICE_HOSTS="80:127.0.0.1:8080" \
            hiddenforge:ci -c '
              python3 -c "import sys,pwd,os; sys.path.insert(0,\"/usr/local/bin\"); import entrypoint; entrypoint.generate_basic_torrc(); pw=pwd.getpwnam(\"tor\"); os.chown(\"/etc/tor/torrc\", pw.pw_uid, pw.pw_gid)"
              su-exec tor tor --verify-config -f /etc/tor/torrc 2>&1 | tail -1 | grep -q "Configuration was valid"
            '
      - name: Smoke - no installer/HTTP-client packages in the venv
        run: |
          docker run --rm --entrypoint sh hiddenforge:ci -c '
            fail=0
            for f in pip urllib3 certifi requests setuptools wheel; do
              if ls /opt/vanguards-venv/lib/python3.12/site-packages/$f 2>/dev/null; then
                echo "FAIL: $f present"; fail=1
              fi
            done
            test ! -e /opt/vanguards-venv/bin/pip || { echo "FAIL: pip binary present"; fail=1; }
            [ $fail -eq 0 ] && echo "venv clean"; exit $fail
          '
      - name: Smoke - vanguards imports cleanly
        run: |
          docker run --rm --entrypoint /opt/vanguards-venv/bin/python3 hiddenforge:ci \
            -c "import vanguards; print('vanguards import ok')"
      - name: Smoke - read-only rootfs + privilege drop
        run: |
          docker run -d --name hf-ro \
            --read-only \
            --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges --security-opt seccomp=unconfined \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --tmpfs /etc/tor:rw,noexec,nosuid,nodev \
            --tmpfs /var/lib/tor:rw,noexec,nosuid,nodev,uid=100,gid=101,mode=0700 \
            -e SERVICE_TOR_SERVICE_HOSTS="80:127.0.0.1:8080" \
            hiddenforge:ci
          sleep 15
          test "$(docker inspect -f '{{.State.Running}}' hf-ro)" = "true"
          docker exec hf-ro ps -o user,comm | grep -E '^tor +tor$'
          docker exec hf-ro sh -c 'test "$(stat -c %U /etc/tor/torrc)" = tor'
          docker rm -f hf-ro

  # Build + smoke under rootless Podman (exercises the chown branch)
  build-podman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Build image (podman)
        run: podman build -t hiddenforge:ci .
      - name: Smoke - rootless startup, plain tmpfs, privilege drop
        run: |
          mkdir -p /tmp/pod-keys
          podman run -d --name hf-pod \
            --cap-drop ALL --cap-add CHOWN --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges --security-opt seccomp=unconfined \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --tmpfs /etc/tor:rw,noexec,nosuid,nodev \
            --tmpfs /var/lib/tor:rw,noexec,nosuid,nodev \
            -v /tmp/pod-keys:/var/lib/tor/hidden_service \
            -e SERVICE_TOR_SERVICE_HOSTS="80:8080" \
            hiddenforge:ci
          sleep 15
          test "$(podman inspect -f '{{.State.Running}}' hf-pod)" = "true"
          podman exec hf-pod ps -o user,comm | grep -E '^tor +tor$'
          podman rm -f hf-pod

  # Vulnerability scan of the built image
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Build image
        run: docker build -t hiddenforge:ci .
      - name: Trivy scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2  # v0.28.0
        with:
          image-ref: hiddenforge:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Rescan the ALREADY-PUBLISHED image for newly-disclosed CVEs. The `scan` job
  # above only covers the image built from the current source; a CVE disclosed
  # against tor/Python AFTER a release would be invisible until the next build.
  # This job pulls what users actually pull and rescans it on a schedule.
  # Runs only on the weekly schedule or a manual dispatch — not on every PR.
  scan-published:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Report ALL HIGH/CRITICAL in the published image (incl. unfixed)
        # Full visibility: prints fixed AND unfixed findings to the log so a
        # newly-disclosed but upstream-unpatched CVE is at least visible. Does
        # not fail the run (exit-code 0) — an unfixed CVE is not yet actionable.
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2  # v0.28.0
        with:
          image-ref: docker.io/doingfedtime/hiddenforge:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: "0"
      - name: Gate on FIXABLE HIGH/CRITICAL in the published image
        # Fails the run only when a fix EXISTS upstream — i.e. the published
        # image is behind and should be rebuilt + republished. That red run is
        # the actionable signal.
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2  # v0.28.0
        with:
          image-ref: docker.io/doingfedtime/hiddenforge:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Push an ntfy alert when the build/scan pipeline fails. Without this, the
  # weekly drift + CVE-rescan checks are a silent alarm. PR failures are skipped
  # (the author already sees the red X); only push/tag/schedule failures alert.
  # The ntfy topic is a repo SECRET (NTFY_TOPIC) because this repo is public and
  # the topic name is the only access control on an ntfy.sh topic. If the secret
  # is unset the step no-ops.
  notify-failure:
    name: Alert on failure (ntfy)
    needs: [lint, unit, build-docker, build-podman, scan, scan-published]
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: ntfy push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret not set; skipping alert."; exit 0
          fi
          curl -fsS \
            -H "Title: HiddenForge CI failed (${EVENT} @ ${REF})" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -d "Build & Test pipeline failed. ${RUN_URL}" \
            "https://ntfy.sh/${NTFY_TOPIC}"
