name: Release (sign & publish)

# Publishes a signed, attested image ONLY on version tags. Requires repo secrets
# (see "One-time setup" in README → Verifying the image):
#   REGISTRY_USER / REGISTRY_TOKEN  - registry push credentials
#   COSIGN_PRIVATE_KEY / COSIGN_PASSWORD - maintainer signing key (cosign)
# Until those secrets exist this workflow no-ops safely (guarded steps).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write      # for SLSA provenance attestation
  packages: write
  attestations: write

env:
  IMAGE: docker.io/doingfedtime/hiddenforge

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Registry login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image (maintainer key)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM (signed, maintainer key)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --key env://COSIGN_PRIVATE_KEY --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"

      - name: SLSA build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
