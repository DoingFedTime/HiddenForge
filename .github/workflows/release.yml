name: Release (sign & publish)

# Publishes a signed, attested image ONLY on version tags. REQUIRES these repo
# secrets to be set (see "One-time setup" in README → Verifying the image):
#   REGISTRY_USER / REGISTRY_TOKEN  - registry push credentials
#   COSIGN_PRIVATE_KEY / COSIGN_PASSWORD - maintainer signing key (cosign)
# These steps are NOT guarded: if the secrets are absent, the login step fails
# and the tag's release run goes red (nothing is published). Set the secrets
# before pushing your first v*.*.* tag.
#
# Optional: NTFY_TOPIC secret — if set, a failed release pushes an ntfy alert.
# Builds multi-arch (linux/amd64 + linux/arm64).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write      # for SLSA provenance attestation
  packages: write
  attestations: write

env:
  IMAGE: docker.io/doingfedtime/hiddenforge

# Serialise releases per tag and NEVER cancel one in flight — cancelling a
# half-finished publish could leave an unsigned or unattested image pushed.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Multi-arch: build for linux/amd64 + linux/arm64 so the image runs on
      # x86_64 servers, Apple Silicon Macs, and ARM boxes (Pi / ARM VPS). QEMU
      # cross-builds arm64; buildx assembles a single multi-arch manifest whose
      # digest is what gets signed. (arm64 build verified against the current
      # Dockerfile.)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Registry login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          # Push BOTH the version tag and :latest. The compose files and the
          # build.yml scan-published job reference :latest, so :latest must track
          # the newest release or users pull a stale image and the rescan checks
          # an artifact disconnected from any signed release. Both tags resolve to
          # one digest, so cosign sign/attest (which operate on the digest) are
          # unaffected. Assumes forward-only releases (a back-tag would move
          # :latest backward — retag manually if you ever patch an old line).
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3

      - name: Sign the image (maintainer key)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM (signed, maintainer key)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --key env://COSIGN_PRIVATE_KEY --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"

      - name: SLSA build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Alert (ntfy) if a release fails — a failed publish must not be silent. Topic
  # is the NTFY_TOPIC repo secret (public repo; the topic name is the access
  # control). No-ops if the secret is unset.
  notify-failure:
    name: Alert on failure (ntfy)
    needs: [release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: ntfy push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret not set; skipping alert."; exit 0
          fi
          curl -fsS \
            -H "Title: HiddenForge RELEASE failed (${REF})" \
            -H "Priority: max" \
            -H "Tags: rotating_light,package" \
            -d "Release publish failed for ${REF}. Image may be partially pushed/unsigned. ${RUN_URL}" \
            "https://ntfy.sh/${NTFY_TOPIC}"
