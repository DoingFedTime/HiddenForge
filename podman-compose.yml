# HiddenForge — rootless Podman compose file
#
# USAGE:
#   1. Copy this file and edit the two lines marked with <-- EDIT
#   2. mkdir -p ./tor-keys
#   3. podman-compose -f podman-compose.yml up -d
#   4. podman-compose -f podman-compose.yml exec tor su-exec tor cat /var/lib/tor/hidden_service/myapp/hostname
#      (replace "myapp" with whatever you used in step 1)
#      The `su-exec tor` is REQUIRED here and is not a typo: this file drops
#      DAC_OVERRIDE, so the exec'd root cannot traverse the 0700 tor-owned
#      DataDirectory. Read it as the tor user. If you hit "Permission denied",
#      do NOT re-add DAC_OVERRIDE or relax the key directory to work around it.
#
# WHY THIS FILE EXISTS (rootless security model):
#   Running Podman rootless means container uid 0 maps to your host user (e.g.
#   uid 1000) via Linux user namespaces.  A container escape gives an attacker
#   only your regular user account — not real root on the host.
#
#   This also eliminates two capabilities that rootful Docker requires:
#     DAC_OVERRIDE — rootful Docker needs this because the ./tor-keys bind mount
#       is owned by host uid 1000, and container root (uid 0) is a different user.
#       In rootless Podman the bind mount appears root-owned inside the container
#       (uid 0 = uid 1000 in the user namespace), so DAC_OVERRIDE is not needed.
#     FOWNER — same reasoning: container root owns the bind mount, so it can
#       chmod without needing FOWNER.
#
#   All other security flags are identical to docker-compose.yml.

networks:
  tor-internal:
    internal: true
  tor-external:

services:
  tor:
    image: sambent.dev/sam/hiddenforge:latest
    restart: unless-stopped

    # ── Security flags ────────────────────────────────────────────────────
    cap_drop:
      - ALL                        # drop every Linux capability
    cap_add:
      - CHOWN        # transfer ownership of hidden_service dir to the tor user
      - SETUID       # su-exec: drop from root → tor to run the Tor daemon
      - SETGID       # su-exec: drop from root → tor group to run the Tor daemon
      # NOTE: DAC_OVERRIDE and FOWNER are NOT listed here.
      # In rootless Podman, container root (uid 0) maps to your host user via
      # user namespaces, so the ./tor-keys bind mount appears root-owned inside
      # the container. No extra capabilities are needed to write there.
    security_opt:
      - no-new-privileges:true     # prevent privilege escalation via setuid
      # NO seccomp=unconfined -- see docker-compose.yml for the full reasoning.
      # Verified separately on rootless podman, whose default profile is not
      # byte-identical to Docker's: the Tor process carries two stacked filters
      # and reaches Bootstrapped 100%.
      # NOTE: no explicit apparmor= here. Rootless Podman frequently cannot load
      # the docker-default profile unprivileged; Podman applies its own default.
    read_only: true                # container filesystem is read-only
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /etc/tor:rw,noexec,nosuid,nodev,size=8m
      # uid=100,gid=101: Tor process runs as the tor user (uid 100) after su-exec drops
      # privileges; the DataDirectory must be owned by that user or Tor refuses to start.
      # NOTE: uid=/gid=/mode= tmpfs options are Docker-specific and not supported
      # by Podman.  The entrypoint explicitly chowns /var/lib/tor to the tor user
      # at startup, so we just allocate the tmpfs here without those options.
      - /var/lib/tor:rw,noexec,nosuid,nodev,size=64m
      # Note: the bind mount below overlays /var/lib/tor/hidden_service so keys persist.

    # ── Resource limits (DoS / fork-bomb / fd-exhaustion containment) ──────
    # podman-compose does NOT apply all of these, measured and read from its
    # source: `pids_limit` only from podman-compose 1.1 (Ubuntu 24.04 ships
    # 1.0.6, which leaves Podman's default of 2048), and `memswap_limit` in no
    # version at all. For the pids cap on an older podman-compose, add
    #     --podman-run-args="--pids-limit=256"
    # to the up command. Swap cannot be limited through podman-compose; run the
    # host without swap. `hiddenforge doctor` measures what was really applied.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
      # NOTE: `nproc` is deliberately NOT set here. RLIMIT_NPROC is counted per
      # HOST uid, and the tor user is uid 100, which other containers share
      # (i2pforge's i2pd is also uid 100). On a host already running >= the
      # limit as uid 100, su-exec's setuid() fails with EAGAIN and Tor never
      # starts. `pids_limit` is the per-container cap that actually works.

    # ── Health: deliberately NO healthcheck under Podman ───────────────────
    # Rootless Podman 4.9 (Ubuntu 24.04's version) runs healthchecks through
    # systemd user timers. Without a reachable systemd user manager -- a service
    # account with no login session, `sudo -iu`, cron, a broken user bus -- a
    # container that has a healthcheck is NEVER restarted when it exits.
    # Measured on Ubuntu 24.04: with a healthcheck, `restart: unless-stopped`
    # left it stopped after exit 1; with none, it restarted every time, with or
    # without a session. Exiting so the restart policy starts it again is how
    # this container recovers on its own: after Tor dies, when a backend moves to
    # a new IP, and when a backend that was down at boot comes up. Without a
    # session Podman cannot run the healthcheck anyway.
    #
    # So no `healthcheck:` key at all -- not even `disable: true`: Docker Compose
    # on the Podman socket sends that as test [NONE], which Podman 4.9 still
    # treats as a healthcheck (measured: not restarted). The published image is
    # OCI, which carries no healthcheck Podman applies (verified with `podman
    # image inspect`). Readiness is `hiddenforge status`, which runs the check
    # itself when the engine reports no health.

    # ── Suppress host-side log file ───────────────────────────────────────
    logging:
      driver: none

    environment:
      # <-- EDIT: change "MYAPP" to your service name (lowercase, hyphens ok)
      # The entrypoint resolves Podman service names automatically — no static IPs needed.
      # Format: "onion_port:service_name:backend_port"
      # Multiple ports: "80:web:80,443:web:443"
      MYAPP_TOR_SERVICE_HOSTS: "80:web:80"   # <-- EDIT (change MYAPP)

    volumes:
      # Hidden service keys persist here across container restarts.
      # Back this directory up — losing it means losing your .onion address.
      - ./tor-keys:/var/lib/tor/hidden_service

    networks:
      - tor-internal   # to reach the backend
      - tor-external   # to reach the Tor network

    # No DNS leaves this container. aardvark-dns still answers backend names on
    # the internal network, but forwards any name it cannot answer upstream --
    # so a backend that is down or not up yet would be announced there, in step
    # with the onion's outages. Tor needs no DNS (it bootstraps from relay IPs);
    # a loopback server nothing listens on ends it.
    dns: 127.0.0.1

    depends_on:
      - web

  # ── Your backend service ──────────────────────────────────────────────────
  # Replace this with your actual application. The key constraints:
  #   - NO 'ports:' mapping — the backend must never be internet-exposed
  #   - Only connect to tor-internal, not tor-external
  web:
    # <-- EDIT: replace with your actual image
    # NOTE: Rootless Podman cannot bind ports < 1024 without NET_BIND_SERVICE.
    # If your backend listens on port 80 or 443, either:
    #   a) Add NET_BIND_SERVICE to cap_add below, OR
    #   b) Configure your backend to listen on port >= 1024 (e.g. 8080) and
    #      update the *_TOR_SERVICE_HOSTS mapping accordingly: "80:web:8080"
    image: docker.io/library/nginx:alpine
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN        # nginx needs these to set up its worker processes
      - SETUID
      - SETGID
      - NET_BIND_SERVICE   # required for rootless Podman to bind port 80
      # DAC_OVERRIDE not needed in rootless: container root owns its own files
      # inside the user namespace.
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m
      - /var/run:rw,noexec,nosuid,nodev,size=8m
    pids_limit: 256
    networks:
      - tor-internal   # reachable by tor, NOT reachable from the internet
